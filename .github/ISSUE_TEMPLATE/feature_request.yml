name: Feature request
description: Suggest a change or a new pack
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The game or situation where the current API falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The API or behaviour you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
